[project]
name = "simple-assistant"
version = "0.1.0"
description = "Simplified voice-controlled computer assistant"
requires-python = ">=3.11"
authors = [
    { name = "Your Name" }
]

dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.0.0",
    "pvporcupine>=3.0.0",
    "pynput>=1.7.0",
    "mss>=9.0.0",
    "opencv-python>=4.8.0",
    "pync>=2.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
